version: '3.8'

services:
  # Main Application Services
  anep-service:
    build: 
      context: .
      dockerfile: Dockerfile.anep
    container_name: novavia-anep
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/novavia
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
      - kafka
      - timescaledb
    volumes:
      - ./anep:/app/anep
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - novavia-network
    restart: unless-stopped

  irip-service:
    build:
      context: .
      dockerfile: Dockerfile.irip
    container_name: novavia-irip
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/novavia
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
      - kafka
      - timescaledb
      - anep-service
    volumes:
      - ./irip:/app/irip
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - novavia-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: novavia-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/novavia
      - REDIS_URL=redis://redis:6379
      - ANEP_SERVICE_URL=http://anep-service:8001
      - IRIP_SERVICE_URL=http://irip-service:8002
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
      - anep-service
      - irip-service
    volumes:
      - ./api:/app/api
      - ./config:/app/config
    networks:
      - novavia-network
    restart: unless-stopped

  # Dashboard Frontend
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: novavia-dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
    depends_on:
      - api-gateway
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
    networks:
      - novavia-network

  # Database Services
  postgres:
    image: postgres:15
    container_name: novavia-postgres
    environment:
      - POSTGRES_DB=novavia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - novavia-network
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: novavia-timescaledb
    environment:
      - POSTGRES_DB=novavia_timeseries
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - novavia-network
    restart: unless-stopped

  # Caching and Message Queue
  redis:
    image: redis:7-alpine
    container_name: novavia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novavia-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "redispassword"

  # Message Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: novavia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - novavia-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: novavia-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - novavia-network

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: novavia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - novavia-network

  grafana:
    image: grafana/grafana:latest
    container_name: novavia-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    networks:
      - novavia-network

  # Development Tools
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novavia-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@novavia.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - novavia-network

volumes:
  postgres_data:
    driver: local
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  novavia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
